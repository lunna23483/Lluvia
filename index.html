<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Caza-EPP | CREAMOSS S.O S.A.S</title>

<style>
:root{
  --ui-bg: rgba(255,255,255,0.85);
  --ui-radius: 12px;
  --panel-pad: 12px;
  --font: "Poppins", "Segoe UI", Roboto, Arial, sans-serif;
}
html,body{height:100%;margin:0;font-family:var(--font)}
body{overflow:hidden;background: linear-gradient(#87CEEB,#ffffff);}
#gameCanvas{display:block}

/* UI igual */
#startOverlay{
  position:fixed; left:0; top:0; right:0; bottom:0;
  display:flex; align-items:center; justify-content:center;
  z-index:70; backdrop-filter: blur(3px);
}
#startCard{
  background:var(--ui-bg); padding:24px; border-radius:16px; text-align:center;
}
input{
  padding:10px; border-radius:8px; border:1px solid #ccc; width:80%;
}
button.primary{
  background:#2b7cff; color:white; border:0; padding:10px 16px; border-radius:10px;
  cursor:pointer; font-weight:600;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- LOGIN -->
<div id="startOverlay">
  <div id="startCard">
    <h1>Caza-EPP 🪖</h1>
    <p>CREAMOSS S.O S.A.S</p>

    <input id="empresaInput" placeholder="Empresa"><br><br>
    <input id="usuarioInput" placeholder="Usuario"><br><br>

    <button id="startBtn" class="primary">JUGAR</button>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "safe-game-71018.firebaseapp.com",
  projectId: "safe-game-71018",
  storageBucket: "safe-game-71018.firebasestorage.app",
  messagingSenderId: "433832606340",
  appId: "1:433832606340:web:4aedd33c547e17db15a0d1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.usuarioActivo = null;

window.guardarProgreso = async (data) => {
  if (!window.usuarioActivo) return;

  const id = window.usuarioActivo.empresa + "_" + window.usuarioActivo.usuario;

  await setDoc(doc(db, "progresos", id), {
    ...data,
    empresa: window.usuarioActivo.empresa,
    usuario: window.usuarioActivo.usuario,
    actualizado: new Date()
  });
};
</script>

<!-- JUEGO -->
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

let score = 0, timeLeft = 60, items = [], caught = 0, level = 1;
let gameInterval = null, playing = false;

// ITEMS
const EPP = ['🪖','🧤','👓','🥾','🦺','🪢'];
const fake = '❌';

// CREAR ITEM
function createItem(){
  const isFake = Math.random() < 0.2;
  items.push({
    emoji: isFake ? fake : EPP[Math.floor(Math.random()*EPP.length)],
    x: Math.random()*W,
    y: -40,
    speed: 2 + Math.random()*3,
    fake: isFake
  });
}

// DIBUJO
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.font="40px serif";

  items.forEach((it,i)=>{
    ctx.fillText(it.emoji,it.x,it.y);
    it.y += it.speed;

    if(it.y > H) items.splice(i,1);
  });
}

// CLICK
canvas.addEventListener('click', (e)=>{
  if(!playing) return;

  items.forEach((it,i)=>{
    if(e.clientX > it.x && e.clientX < it.x+40 &&
       e.clientY > it.y-30 && e.clientY < it.y+30){

      if(it.fake) score -= 5;
      else { score += 10; caught++; }

      items.splice(i,1);
    }
  });
});

// LOOP
function gameLoop(){
  if(Math.random()<0.05) createItem();
  draw();
}

// START GAME (con login)
function startGame(){

  const empresa = document.getElementById('empresaInput').value.trim();
  const usuario = document.getElementById('usuarioInput').value.trim();

  if(!empresa || !usuario){
    alert("Ingresa empresa y usuario");
    return;
  }

  window.usuarioActivo = { empresa, usuario };

  score = 0;
  caught = 0;
  level = 1;
  items = [];
  playing = true;

  document.getElementById('startOverlay').style.display='none';

  gameInterval = setInterval(gameLoop,30);

  setTimeout(endGame, 60000);
}

// END GAME + FIREBASE
function endGame(){
  playing = false;
  clearInterval(gameInterval);

  guardarProgreso({
    puntaje: score,
    nivel: level,
    objetos: caught
  });

  alert("Puntaje: " + score);
  location.reload();
}

// BOTON
document.getElementById('startBtn').addEventListener('click', startGame);
</script>

</body>
</html>
