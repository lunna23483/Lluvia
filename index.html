<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Caza-EPP | CREAMOSS S.O S.A.S</title>

<style>
:root{
  --ui-bg: rgba(255,255,255,0.85);
  --ui-radius: 12px;
  --panel-pad: 12px;
  --font: "Poppins", "Segoe UI", Roboto, Arial, sans-serif;
}
html,body{height:100%;margin:0;font-family:var(--font)}
body{overflow:hidden;background: linear-gradient(#87CEEB,#ffffff);}
#gameCanvas{display:block}
#hud{
  position:fixed; left:12px; top:12px;
  background:var(--ui-bg); padding:var(--panel-pad);
  border-radius:var(--ui-radius);
}
#gameOver{
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
  background:var(--ui-bg); padding:18px; border-radius:18px;
  display:none; text-align:center;
}
button{padding:10px;border-radius:10px;border:none;cursor:pointer;}
</style>

</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
🧢 Puntos: <span id="score">0</span><br>
⏱️ Tiempo: <span id="time">60</span>
</div>

<div id="gameOver">
<h2>Fin del juego</h2>
<p>Puntaje: <span id="finalScore"></span></p>
<button onclick="restartGame()">Reiniciar</button>
</div>

<!-- 🔥 FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA9ef1Nxrly12ciCsjYo7E5ZgOlPC-USKU",
  authDomain: "safe-game-71018.firebaseapp.com",
  projectId: "safe-game-71018",
  storageBucket: "safe-game-71018.firebasestorage.app",
  messagingSenderId: "433832606340",
  appId: "1:433832606340:web:4aedd33c547e17db15a0d1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 DATOS DEL CONTENEDOR
const params = new URLSearchParams(window.location.search);
const empresa = params.get("empresa") || "demo";
const userId = params.get("user") || "anonimo";
const juego = "cazaepp";

// 🔥 GUARDAR
async function guardarPuntaje(puntos){

  const ref = doc(db,
    "empresas", empresa,
    "juegos", juego,
    "jugadores", userId
  );

  const snap = await getDoc(ref);

  if(snap.exists()){
    const data = snap.data();

    await updateDoc(ref, {
      puntos: Math.max(puntos, data.puntos),
      intentos: (data.intentos || 0) + 1,
      ultimaActualizacion: new Date()
    });

  } else {

    await setDoc(ref, {
      puntos: puntos,
      intentos: 1,
      ultimaActualizacion: new Date()
    });

  }
}

window.guardarPuntaje = guardarPuntaje;

</script>

<!-- 🎮 TU JUEGO -->
<script>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

let score = 0, timeLeft = 60, playing = false;

function startGame(){
  score = 0;
  timeLeft = 60;
  playing = true;
  loop();
  timer();
}

function loop(){
  if(!playing) return;
  ctx.clearRect(0,0,W,H);
  ctx.font="40px Arial";
  ctx.fillText("🪖", Math.random()*W, Math.random()*H);
  requestAnimationFrame(loop);
}

function timer(){
  const t = setInterval(()=>{
    timeLeft--;
    document.getElementById('time').innerText = timeLeft;
    document.getElementById('score').innerText = score;

    if(timeLeft<=0){
      clearInterval(t);
      endGame();
    }
  },1000);
}

function endGame(){

  // 🔥 GUARDA EN FIREBASE
  guardarPuntaje(score);

  playing=false;
  document.getElementById('finalScore').innerText = score;
  document.getElementById('gameOver').style.display='block';
}

function restartGame(){
  document.getElementById('gameOver').style.display='none';
  startGame();
}

// INICIO
startGame();

</script>

</body>
</html>
