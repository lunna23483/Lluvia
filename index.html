<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA9ef1Nxrly12ciCsjYo7E5ZgOlPC-USKU",
    authDomain: "safe-game-71018.firebaseapp.com",
    projectId: "safe-game-71018",
    storageBucket: "safe-game-71018.appspot.com",
    messagingSenderId: "433832606340",
    appId: "1:433832606340:web:4aedd33c547e17db15a0d1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.guardarPuntajeFirebase = async function(empresa, usuario, juego, puntaje) {
    try {
      await addDoc(collection(db, "historial_puntajes"), {
        empresa,
        usuario,
        juego,
        puntaje,
        fecha: serverTimestamp()
      });
      console.log("Puntaje guardado en Firebase");
    } catch(e) {
      console.error("Error guardando puntaje:", e);
    }
  }
</script>

function endGame(){
  playing=false; clearInterval(gameInterval); clearInterval(timerInterval); stopMusic(); soundVictory();

  if(score>highScore){ highScore=score; localStorage.setItem('cazaEPP_high',highScore); document.getElementById('highScore').textContent=highScore; document.getElementById('finalMsg').textContent='¡Nuevo récord! 🏆';}
  else document.getElementById('finalMsg').textContent='Sigue intentándolo para superar tu récord.';

  document.getElementById('gameOver').style.display='block';

  // 🔥 Guardar puntaje en Firebase
  const params = new URLSearchParams(window.location.search);
  const empresa = params.get('empresa') || 'anonimo';
  const usuario = params.get('user') || 'jugador';
  guardarPuntajeFirebase(empresa, usuario, 'Caza-EPP', score);
}
